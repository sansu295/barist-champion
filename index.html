<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Barista Certification & Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

  <header class="bg-white border-b border-slate-200 p-6">
    <h1 class="text-2xl font-bold text-amber-900">Barista Certification Portal</h1>
  </header>

  <main class="p-6 max-w-4xl mx-auto space-y-8">
    
    <!-- New Interactive Quiz Section -->
    <section id="quizSection" class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-semibold mb-4">Certification Quiz</h2>
      <div id="quizContainer">
        <div id="questionText" class="text-lg mb-4 font-medium">What is the ideal extraction time for a double espresso?</div>
        <div id="optionsContainer" class="space-y-2">
            <button onclick="checkAnswer('20-30s')" class="block w-full p-3 bg-amber-50 hover:bg-amber-100 rounded-lg text-left transition">20-30 seconds</button>
            <button onclick="checkAnswer('10-15s')" class="block w-full p-3 bg-slate-50 hover:bg-slate-100 rounded-lg text-left transition">10-15 seconds</button>
            <button onclick="checkAnswer('40-50s')" class="block w-full p-3 bg-slate-50 hover:bg-slate-100 rounded-lg text-left transition">40-50 seconds</button>
        </div>
        <div id="feedbackText" class="mt-4 font-semibold hidden"></div>
      </div>
    </section>

    <!-- Leaderboard Section -->
    <section class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-semibold mb-4">Certification Leaderboard</h2>
      <table class="w-full">
        <thead>
          <tr class="text-left text-slate-400 text-sm">
            <th class="py-2">Rank</th>
            <th class="py-2">Name</th>
            <th class="py-2">Store</th>
            <th class="py-2 text-right">Score</th>
          </tr>
        </thead>
        <tbody id="fullLeaderboardTable"></tbody>
      </table>
    </section>
  </main>

  <script>
    function checkAnswer(answer) {
        const feedback = document.getElementById('feedbackText');
        if(answer === '20-30s') {
            feedback.innerText = "Correct! The standard extraction range for a balanced espresso.";
            feedback.className = "mt-4 font-semibold text-emerald-600";
        } else {
            feedback.innerText = "Incorrect. Aim for 20-30 seconds for optimal flavor.";
            feedback.className = "mt-4 font-semibold text-red-600";
        }
        feedback.classList.remove('hidden');
    }
  </script>
</body>
</html>
