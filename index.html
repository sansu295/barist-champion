<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Barista Certification System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          colors: { 
            costa: { burgundy: '#6B1D2F', dark: '#4A121F', gold: '#D4A359', cream: '#FAF6F0' } 
          } 
        } 
      }
    }
  </script>
</head>
<body class="bg-costa-cream min-h-screen text-slate-800">

  <nav class="bg-costa-burgundy text-white p-4 flex justify-between items-center shadow-lg">
    <h1 class="font-bold text-xl">Barista Portal</h1>
    <div class="space-x-4">
      <button onclick="showView('quiz')" class="hover:text-costa-gold">Quiz View</button>
      <button onclick="showView('admin')" class="hover:text-costa-gold font-bold underline">Manager Dashboard</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-6" id="app-container">
    <!-- Quiz View -->
    <section id="view-quiz" class="space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-costa-gold">
        <h2 class="text-3xl font-bold text-costa-burgundy mb-4">Certification Quiz</h2>
        <div id="quiz-content">Loading assessment...</div>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-lg">
        <h3 class="font-bold mb-3">Report an Issue</h3>
        <form id="feedbackForm" class="grid gap-3">
          <input type="text" id="fb-user" placeholder="Your Name" class="p-2 border rounded" required>
          <textarea id="fb-issue" placeholder="Describe the problem..." class="p-2 border rounded" required></textarea>
          <button type="submit" class="bg-costa-gold text-white py-2 rounded font-bold">Submit Feedback</button>
        </form>
      </div>
    </section>

    <!-- Manager Dashboard View -->
    <section id="view-admin" class="hidden space-y-6">
      <div class="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-costa-burgundy">
        <h2 class="text-3xl font-bold text-costa-dark mb-6">Manager Feedback Review</h2>
        <div id="admin-feedback-list" class="space-y-4">
          <!-- Feedback list injected here -->
        </div>
      </div>
    </section>
  </main>

  <script>
    function showView(view) {
      document.getElementById('view-quiz').classList.toggle('hidden', view !== 'quiz');
      document.getElementById('view-admin').classList.toggle('hidden', view !== 'admin');
      if (view === 'admin') refreshAdmin();
    }

    const FEEDBACK_KEY = 'barista_feedback_data';

    document.getElementById('feedbackForm').onsubmit = (e) => {
      e.preventDefault();
      const db = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');
      db.push({
        user: document.getElementById('fb-user').value,
        issue: document.getElementById('fb-issue').value,
        time: new Date().toLocaleTimeString()
      });
      localStorage.setItem(FEEDBACK_KEY, JSON.stringify(db));
      alert('Issue reported to management.');
      e.target.reset();
    };

    function refreshAdmin() {
      const list = document.getElementById('admin-feedback-list');
      const db = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');
      if (db.length === 0) {
        list.innerHTML = '<p class="text-slate-400 italic">No issues reported yet.</p>';
        return;
      }
      list.innerHTML = db.map(i => `
        <div class="p-4 bg-white border border-slate-200 rounded-lg shadow-sm">
          <p class="font-bold text-costa-burgundy">${i.user}</p>
          <p class="text-slate-600">${i.issue}</p>
          <p class="text-xs text-slate-400 mt-2">${i.time}</p>
        </div>
      `).join('');
    }

    // Mock quiz logic
    document.getElementById('quiz-content').innerHTML = `
      <p class="text-lg">Welcome! Currently, the system is undergoing maintenance. Please use the feedback form below if you encounter any errors.</p>
    `;
  </script>
</body>
</html>
